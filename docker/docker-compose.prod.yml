# Déploiement de type production — Finance Paiements (Gunicorn + WhiteNoise + PostgreSQL).
#
#   cp .env.example .env    # puis renseigner DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS…
#   cd docker
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Le TLS est attendu en amont (reverse proxy : Nginx, Traefik, Caddy…).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: >
      sh -c "python backend/manage.py migrate --noinput &&
             python backend/manage.py collectstatic --noinput &&
             gunicorn --chdir backend config.wsgi:application
             --bind 0.0.0.0:8001 --workers 3 --access-logfile -"
    ports:
      - "8001:8001"
    volumes:
      - media_prod:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_prod:
  media_prod:
